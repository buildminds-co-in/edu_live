name = "edu-live-worker"
main = "src/index.ts"
account_id = "665961d811029d3117ce11b8053eea18"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "edu-live-chunks"
remote = true

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "edu-live-pdfs"

[[d1_databases]]
binding = "EDU_LIVE_DB"
database_name = "edu-live-db"
database_id = "f12708d6-047e-4a0a-a929-24ae19dc298d"

[browser]
binding = "BROWSER"

[vars]
GUARDRAIL_ENABLED = "true"
JEV_ENABLED = "true"
